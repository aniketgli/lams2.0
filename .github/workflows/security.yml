name: Security test
# Starts the portal against a throw-away MySQL database with test accounts and attacks it
# (scripts/security/pentest.ts). Nothing here touches the live server or its database.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pentest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lams2_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/lams2_test
      SECURITY_TEST_DB: '1'
      NODE_ENV: production
      SESSION_SECRET: ci-only-session-secret-0123456789abcdefghijklmnop
      SETTINGS_ENCRYPTION_KEY: ci-only-settings-key-0123456789abcdefghijkl
      LOGIN_CAPTCHA: 'off'
      UPLOAD_DIR: /tmp/lams2-uploads
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Load the live database structure (structure only, no data)
        run: |
          M="mysql -h127.0.0.1 -uroot -proot lams2_test"
          $M < scripts/sql/fixtures/live_schema_2026-11-19.sql > /tmp/load.out 2>&1 || { cat /tmp/load.out; exit 1; }
          # The starting rows the earlier migrations put in (lists, role catalog, system accounts, leave types):
          # every earlier migration is safe to re-run, so they are applied once more with errors ignored.
          for f in $(ls migrations/*.sql | sort | awk -F/ '$2 < "20261219"'); do
            mysql -h127.0.0.1 -uroot -proot --force lams2_test < "$f" > /dev/null 2>&1 || true
          done
          $M < scripts/sql/ci/legacy_sample.sql > /tmp/sample.out 2>&1 || { cat /tmp/sample.out; exit 1; }
          $M -N -e "SELECT COUNT(*) AS tables FROM information_schema.TABLES WHERE TABLE_SCHEMA='lams2_test'" 2>/dev/null
      - name: Normalization and later migrations (twice; the second run must change nothing)
        run: |
          for run in 1 2; do
            echo "=== run $run"
            # The normalization files and every later migration, in order.
            for f in $(ls migrations/*.sql | sort | awk -F/ '$2 >= "20261219"'); do
              if ! mysql -h127.0.0.1 -uroot -proot lams2_test < "$f" > /tmp/mig.out 2>&1; then
                grep -v "Using a password" /tmp/mig.out; echo "FAILED: $f"; exit 1
              fi
              grep -v "Using a password" /tmp/mig.out | tail -4
            done
          done
      - name: Check the normalized data
        run: bash scripts/sql/ci/verify_normalization.sh lams2_test
      - name: Seed test accounts
        run: npx tsx scripts/security/seed.ts
      - name: Read-only database audit
        run: npx tsx scripts/db-audit.ts || true
      - name: Build and start the portal
        run: |
          mkdir -p /tmp/lams2-uploads && chmod 750 /tmp/lams2-uploads
          bun run build
          nohup node server.ts > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health/ready
      - name: Sign-in and sign-out in a real browser (two tabs)
        run: |
          npm i --prefix /tmp/pw --no-audit --no-fund playwright-core@1 > /dev/null
          SCREENSHOT_DIR=/tmp PLAYWRIGHT_CORE=/tmp/pw/node_modules/playwright-core/index.mjs bun scripts/security/browser_session.ts
      - name: Normalized tables work through the app
        run: bun scripts/security/normalized_flows.ts
      - name: Attack it
        # A minute's pause first, so the per-minute write limit is not already used up by the steps above.
        run: sleep 61 && SECURITY_REPORT=/tmp/security-report.md SECURITY_UPLOAD_DIR=/tmp/lams2-uploads bun scripts/security/pentest.ts
      - name: Data script for the first PMS projects (twice; the second run must add nothing)
        run: bash scripts/sql/ci/check_pms_projects_data.sh lams2_test
      - name: Server log
        if: always()
        run: tail -150 /tmp/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            /tmp/security-report.md
            /tmp/server.log
            /tmp/*.png
