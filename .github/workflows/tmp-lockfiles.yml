name: TEMP regenerate lockfiles
# Temporary: regenerates package-lock.json and bun.lock after removing unused dependencies, and commits them
# to this branch. Removed before merge.
on:
  push:
    branches: [qa/cleanup-hardening]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: bun install
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lock
          git diff --cached --quiet || { git commit -m "Regenerate lockfiles without the unused dependencies"; git push; }
